<!DOCTYPE html>
<html>
<title>my photos</title>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
        body {
            cursor: url("littleblackstar.png"), auto;
        }

        a {
            cursor: url("littleblackstar.png"), auto;
        }
    </style>

</head>
<script>
let lastX = 0;
let lastY = 0;

document.addEventListener("mousemove", function(e) {

    const distance = Math.hypot(e.clientX - lastX, e.clientY - lastY);

    if (distance < 25) {
        return;
    }

    lastX = e.clientX;
    lastY = e.clientY;

    const star = document.createElement("div");

    star.innerHTML = Math.random() > 0.5 ? "★" : "✦";
    star.style.position = "fixed";
    star.style.left = e.clientX + "px";
    star.style.top = e.clientY + "px";
    star.style.pointerEvents = "none";
    star.style.fontSize = (Math.random() * 8 + 7) + "px";
    star.style.color = "black";
    star.style.opacity = "0.8";
    star.style.transition = "opacity 2.5s, transform 2.5s";
    star.style.transform = "translate(-50%, -50%)";

    document.body.appendChild(star);

    setTimeout(function() {
        star.style.opacity = "0";
        star.style.transform = "translate(-50%, -80%) rotate(30deg)";
    }, 50);

    setTimeout(function() {
        star.remove();
    }, 2550);
});
</script>
</head>

        width: 90% !important;
        max-width: 350px !important;
        height: auto !important;

    }

        left: auto !important;
        right: auto !important;
        top: auto !important;
        bottom: auto !important;
