<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>my photos</title>

    <link rel="stylesheet" href="style.css">

    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            overflow-x: hidden;
            cursor: url("littleblackstar.png"), auto;
        }

        a, img {
            cursor: url("littleblackstar.png"), auto;
        }

        /* PAGE HEADING */

        .page-heading {
            margin: 8px;
            font-style: italic;
        }

        /* ♡ DESKTOP PHOTO ARRANGEMENT ♡ */

        .desktop-photos {
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    gap: 60px;
    flex-wrap: wrap;
    margin-top: 100px;
    padding-left: 5%;
    box-sizing: border-box;
}

        .photo-wrapper {
            position: static;
        }

        .photo2 {
            display: block;
            width: 400px;
            height: auto;
        }

        .photo4 {
            display: block;
            width: 240px;
            height: auto;
        }

        .photo33 {
            display: block;
            width: 400px;
            height: auto;
        }

        .photo41 {
            display: block;
            width: 290px;
            height: auto;
        }

        .photo43 {
            display: block;
            width: 430px;
            height: auto;
        }

        .photo44 {
            display: block;
            width: 325px;
            height: auto;
        }

        .photo47 {
            display: block;
            width: 350px;
            height: auto;
        }

        .photo50 {
            display: block;
            width: 350px;
            height: auto;
        }

        .photo46 {
            display: block;
            width: 360px;
            height: auto;
        }


        /* ♡ MOBILE LAYOUT ♡ */

        @media screen and (max-width: 600px) {

            html, body {
                margin: 0 !important;
                padding: 0 !important;
                min-height: 100% !important;
                height: auto !important;
                overflow-x: hidden !important;
            }

            body {
                padding: 20px 0 40px !important;
            }

            .page-heading {
                margin: 8px 12px 24px;
            }

            /* Stack the photos vertically */

            .desktop-photos {
                display: block;
                margin-top: 0;
            }

            .photo-wrapper {
                position: relative !important;
                left: auto !important;
                right: auto !important;
                top: auto !important;
                bottom: auto !important;
                transform: none !important;

                display: block !important;
                width: 90% !important;
                max-width: 350px !important;
                height: auto !important;

                margin: 0 auto 30px !important;
            }

            /* Make photos fit the phone screen */

            .photo-wrapper img {
                position: static !important;
                left: auto !important;
                right: auto !important;
                top: auto !important;
                bottom: auto !important;
                transform: none !important;

                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                margin: 0 auto !important;
            }
        }
    </style>

</head>

<body>

    <p class="page-heading">★ my photos ★</p>

    <!-- ♡ PHOTOS ♡ -->

    <div class="desktop-photos">

        <!-- PHOTO 2 -->
        <div class="photo-wrapper">
            <img class="photo2" src="photo2.jpg" alt="Photo 2">
        </div>

        <!-- PHOTO 4 -->
        <div class="photo-wrapper">
            <img class="photo4" src="photo4.jpg" alt="Photo 4">
        </div>

        <!-- PHOTO 33 -->
        <div class="photo-wrapper">
            <img class="photo33" src="photo33.jpg" alt="Photo 33">
        </div>

        <!-- PHOTO 41 -->
        <div class="photo-wrapper">
            <img class="photo41" src="photo41.jpg" alt="Photo 33">
        </div>

         <!-- PHOTO 43 -->
        <div class="photo-wrapper">
            <img class="photo43" src="photo43.jpg" alt="Photo 33">
        </div>

         <!-- PHOTO 44 -->
        <div class="photo-wrapper">
            <img class="photo44" src="photo44.jpg" alt="Photo 33">
        </div>

          <!-- PHOTO 44 -->
        <div class="photo-wrapper">
            <img class="photo47" src="photo47.jpg" alt="Photo 33">
        </div>

          <!-- PHOTO 44 -->
        <div class="photo-wrapper">
            <img class="photo47" src="photo50.jpg" alt="Photo 33">
        </div>

         <!-- PHOTO 44 -->
        <div class="photo-wrapper">
            <img class="photo46" src="photo46.jpg" alt="Photo 33">
        </div>

    </div>

    <!-- ♡ STAR CURSOR TRAIL ♡ -->

    <script>
        let lastX = 0;
        let lastY = 0;

        document.addEventListener("mousemove", function(e) {

            const distance = Math.hypot(e.clientX - lastX, e.clientY - lastY);

            if (distance < 25) {
                return;
            }

            lastX = e.clientX;
            lastY = e.clientY;

            const star = document.createElement("div");

            star.innerHTML = Math.random() > 0.5 ? "★" : "✦";
            star.style.position = "fixed";
            star.style.left = e.clientX + "px";
            star.style.top = e.clientY + "px";
            star.style.pointerEvents = "none";
            star.style.fontSize = (Math.random() * 8 + 7) + "px";
            star.style.color = "black";
            star.style.opacity = "0.8";
            star.style.transition = "opacity 2.5s, transform 2.5s";
            star.style.transform = "translate(-50%, -50%)";

            document.body.appendChild(star);

            setTimeout(function() {
                star.style.opacity = "0";
                star.style.transform = "translate(-50%, -80%) rotate(30deg)";
            }, 50);

            setTimeout(function() {
                star.remove();
            }, 2550);

        });
    </script>

</body>

</html>
