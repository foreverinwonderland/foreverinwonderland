<!DOCTYPE html>
<html>

<head>
    <title>★ welcome to wonderland!</title>

    <style>
        body {
            cursor: url("littleblackstar.png"), auto;
        }

        a {
            cursor: url("littleblackstar.png"), auto;
        }
    </style>

</head>
<script>
let lastX = 0;
let lastY = 0;

document.addEventListener("mousemove", function(e) {

    const distance = Math.hypot(e.clientX - lastX, e.clientY - lastY);

    if (distance < 25) {
        return;
    }

    lastX = e.clientX;
    lastY = e.clientY;

    const star = document.createElement("div");

    star.innerHTML = Math.random() > 0.5 ? "★" : "✦";
    star.style.position = "fixed";
    star.style.left = e.clientX + "px";
    star.style.top = e.clientY + "px";
    star.style.pointerEvents = "none";
    star.style.fontSize = (Math.random() * 8 + 7) + "px";
    star.style.color = "black";
    star.style.opacity = "0.8";
    star.style.transition = "opacity 2.5s, transform 2.5s";
    star.style.transform = "translate(-50%, -50%)";

    document.body.appendChild(star);

    setTimeout(function() {
        star.style.opacity = "0";
        star.style.transform = "translate(-50%, -80%) rotate(30deg)";
    }, 50);

    setTimeout(function() {
        star.remove();
    }, 2550);
});
</script>
<body>

<center style="margin-top: 100px;">
    
    <a href="menu.html">
        <img src="CAMERA.png" width="800"
        onmouseover="this.style.filter='drop-shadow(0 0 30px black)'"
        onmouseout="this.style.filter='none'">
    </a>

</center>

</body>

</html>
